<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="EvalLoop Jobs is a curated platform for AI, LLM evaluation, data annotation, AI training, GenAI, prompt engineering, and agentic AI opportunities." />
<title>EvalLoop Jobs — AI, LLM & Data Annotation Opportunities</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chatbot.css">

<style>

:root{
  --bg:#0b1224;
  --ink:#f5f8ff;
  --muted:#8fa0bb;
  --lime:#2588ff;
  --paper:#111d36;
  --dark:#0b1224;
  --border:#233555;
  --cyan:#4db3ff;
  --blue:#2588ff;
  --white:#f5f8ff;
  --red:#ff4d61;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
  cursor:none;
}

a{
  color:inherit;
  text-decoration:none;
  transition:
    color .22s ease,
    transform .22s ease,
    background-color .22s ease,
    box-shadow .22s ease;
}

button,input{font:inherit}
button{cursor:pointer}

.shell{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:var(--bg);
}

.shell:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background-image:
    linear-gradient(rgba(37,136,255,.11) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,136,255,.11) 1px,transparent 1px);
  background-size:44px 44px;
}

.wrap{
  max-width:1240px;
  margin:auto;
  padding-left:32px;
  padding-right:32px;
}

/* =========================
   HEADER
========================= */

.header{
  width:min(1176px,calc(100% - 64px));
  min-height:88px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:28px;
  border-bottom:1px solid var(--border);
}

.logo{
  font:700 13px "Space Grotesk";
  letter-spacing:.12em;
  display:flex;
  align-items:center;
  gap:9px;
}

.logo-mark{
  display:grid;
  place-items:center;
  width:23px;
  height:23px;
  border-radius:50%;
  background:var(--lime);
  color:var(--ink);
  font-size:14px;
  box-shadow:0 0 22px rgba(37,136,255,.3);
}

.logo-dot{
  color:var(--cyan);
}

.nav{
  display:flex;
  gap:34px;
  margin-left:auto;
  color:var(--muted);
  font-size:12px;
}

.nav a:hover,
.top-cta:hover,
.text-link:hover,
.back:hover{
  color:var(--cyan);
  transform:translateY(-2px);
}

.top-cta{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,.23);
  border-radius:999px;
  font-size:12px;
}

.top-cta:hover{
  border-color:var(--lime);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:650px;
  padding-top:90px;
  padding-bottom:112px;
  display:grid;
  grid-template-columns:.92fr 1.08fr;
  gap:64px;
  align-items:center;
  position:relative;
  isolation:isolate;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(77,179,255,.3) 1px,transparent 1px),
    linear-gradient(90deg,rgba(77,179,255,.3) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:
    radial-gradient(
      ellipse 165px 165px at var(--cursor-x,50%) var(--cursor-y,35%),
      black 0%,
      rgba(0,0,0,.86) 45%,
      transparent 100%
    );
  -webkit-mask-image:
    radial-gradient(
      ellipse 165px 165px at var(--cursor-x,50%) var(--cursor-y,35%),
      black 0%,
      rgba(0,0,0,.86) 45%,
      transparent 100%
    );
}

.hero > *{
  position:relative;
  z-index:1;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--cyan);
  font:700 10px "Space Grotesk";
  letter-spacing:.16em;
}

.eyebrow:before{
  content:"";
  width:29px;
  height:1px;
  background:var(--lime);
  box-shadow:0 0 12px var(--lime);
}

h1{
  max-width:615px;
  margin:24px 0 26px;
  font:600 clamp(3.4rem,6vw,6.8rem)/.93 "Space Grotesk";
  letter-spacing:-.075em;
}

h1 em,
.section-title em{
  color:var(--cyan);
  font-style:italic;
  font-weight:400;
}

.lede{
  max-width:480px;
  color:var(--muted);
  font-size:16px;
  line-height:1.65;
}

.actions{
  display:flex;
  align-items:center;
  gap:28px;
  margin-top:34px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  min-height:46px;
  padding:0 18px;
  border-radius:4px;
  font-size:12px;
  font-weight:700;
}

.primary{
  color:var(--ink);
  background:var(--lime);
  transition:.25s;
  box-shadow:0 0 22px rgba(37,136,255,.25);
}

.primary:hover{
  background:var(--cyan);
  transform:translateY(-3px);
  box-shadow:0 16px 38px rgba(37,136,255,.42);
}

.text-link{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.note{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:58px;
  color:var(--muted);
  font-size:11px;
}

.note b{color:var(--cyan)}

/* =========================
   HERO VISUAL
========================= */

.visual{
  min-height:480px;
  position:relative;
  display:grid;
  place-items:center;
  perspective:1100px;
}

.visual:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at var(--spot-x,70%) var(--spot-y,35%),
      rgba(37,136,255,.13),
      transparent 24%
    );
  pointer-events:none;
}

.orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.orb.one{
  width:360px;
  height:360px;
  right:4%;
  top:11%;
  background:radial-gradient(circle,rgba(37,136,255,.25),transparent 67%);
  animation:pulse 5s ease-in-out infinite;
}

.orb.two{
  width:250px;
  height:250px;
  left:0;
  bottom:4%;
  background:radial-gradient(circle,rgba(77,179,255,.16),transparent 70%);
  animation:pulse 7s ease-in-out infinite reverse;
}

.board{
  position:absolute;
  width:min(100%,435px);
  border-radius:7px;
}

.main-board{
  z-index:2;
  min-height:393px;
  padding:27px 30px 23px;
  right:5%;
  top:10%;
  color:var(--ink);
  background:linear-gradient(145deg,rgba(21,35,63,.98),rgba(15,25,48,.98));
  border:1px solid var(--border);
  box-shadow:
    0 28px 70px rgba(0,0,0,.42),
    0 0 38px rgba(37,136,255,.16);
  transform:rotate(2.8deg);
  animation:
    float 6s ease-in-out infinite,
    consoleGlow 4s ease-in-out infinite;
}

.board-top{
  display:flex;
  gap:8px;
  color:var(--muted);
  font:800 9px "Space Grotesk";
  letter-spacing:.14em;
}

.live{
  width:6px;
  height:6px;
  margin-top:2px;
  border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 11px var(--lime);
}

.board-num{
  margin-left:auto;
  color:var(--cyan);
}

.board-title{
  display:flex;
  gap:16px;
  margin-top:44px;
}

.spark{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:0 0 auto;
  border-radius:50%;
  background:var(--lime);
  color:var(--ink);
  font-size:19px;
}

.board-title small{
  color:var(--muted);
  font:800 9px "Space Grotesk";
  letter-spacing:.15em;
}

.board-title h2{
  margin:8px 0 0;
  color:var(--ink);
  font:500 34px/.96 "Space Grotesk";
  letter-spacing:-.07em;
}

.board-title em{
  color:var(--cyan);
  font:400 34px Georgia;
}

.rule{
  height:1px;
  margin:32px 0 22px;
  background:var(--border);
}

.label{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:.13em;
}

.feature-name{
  margin-top:10px;
  color:var(--ink);
  font:600 21px "Space Grotesk";
}

.feature-name span{
  color:var(--muted);
  font-size:17px;
  font-weight:400;
}

.meta{
  display:flex;
  justify-content:space-between;
  margin-top:17px;
  color:var(--muted);
  font-size:11px;
}

.reward{
  color:var(--cyan);
  font-weight:700;
}

.board-link{
  display:inline-flex;
  gap:8px;
  margin-top:36px;
  padding-bottom:7px;
  border-bottom:1px solid var(--lime);
  color:var(--cyan);
  font-size:11px;
  font-weight:700;
}

.board-link:hover{
  transform:translateY(-2px);
  text-shadow:0 0 14px var(--cyan);
}

.back-board{
  height:128px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:21px 23px;
  color:rgba(241,238,227,.55);
  background:linear-gradient(145deg,rgba(17,29,54,.9),rgba(15,25,48,.84));
  border:1px solid var(--border);
  box-shadow:0 16px 40px rgba(0,0,0,.2);
}

.back-board span{
  color:var(--muted);
  font-size:9px;
  letter-spacing:.14em;
}

.back-board b{
  color:var(--ink);
  font:500 24px "Space Grotesk";
}

.back-one{
  left:8%;
  top:11%;
  transform:rotate(-10deg);
}

.back-two{
  right:0;
  bottom:8%;
  transform:rotate(-8deg);
}

.caption{
  position:absolute;
  bottom:22px;
  left:9%;
  display:flex;
  gap:16px;
  color:var(--muted);
  font:9px/1.25 "Space Grotesk";
  letter-spacing:.12em;
}

.caption span:first-child{
  color:var(--cyan);
}

/* =========================
   SIGNALS
========================= */

.signals{
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  background:rgba(11,18,36,.65);
}

.signal-grid{
  min-height:132px;
  display:grid;
  grid-template-columns:repeat(3,1fr) 1.4fr;
  gap:20px;
  align-items:center;
}

.signal{
  display:flex;
  align-items:baseline;
  gap:13px;
  border-right:1px solid var(--border);
}

.signal strong{
  color:var(--cyan);
  font:400 40px "Space Grotesk";
  letter-spacing:-.08em;
}

.signal span,
.signal-note{
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}

.signal-note{text-align:right}

/* =========================
   DIRECTORY
========================= */

.directory{
  padding-top:132px;
  padding-bottom:132px;
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:50px;
}

.section-title{
  margin:18px 0 0;
  color:var(--ink);
  font:600 clamp(2.8rem,5vw,5.1rem)/.94 "Space Grotesk";
  letter-spacing:-.08em;
}

.section-head>p{
  max-width:300px;
  margin:0 4% 4px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-top:56px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tab{
  padding:8px 13px;
  border:1px solid transparent;
  border-radius:999px;
  color:var(--muted);
  background:transparent;
  font-size:11px;
}

.tab.active,
.tab:hover{
  color:var(--ink);
  background:var(--lime);
  box-shadow:0 0 20px rgba(37,136,255,.24);
}

.search{
  display:flex;
  gap:9px;
  width:188px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.2);
  color:var(--muted);
}

.search input{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  color:var(--ink);
  background:transparent;
  font-size:11px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
  margin-top:20px;
}

.card{
  min-height:280px;
  display:flex;
  flex-direction:column;
  padding:21px;
  border:1px solid var(--border);
  border-radius:6px;
  background:linear-gradient(145deg,rgba(17,29,54,.9),rgba(15,25,48,.84));
  transition:.25s;
  will-change:transform;
}

.card:hover{
  border-color:var(--lime);
  transform:translateY(-5px);
  box-shadow:
    0 18px 38px rgba(0,0,0,.25),
    0 0 28px rgba(37,136,255,.12);
}

.card-top,
.card-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mark{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--lime);
  color:var(--ink);
  font:700 15px "Space Grotesk";
}

.num{
  color:var(--muted);
  font:10px "Space Grotesk";
}

.card-body{
  flex:1;
  padding-top:29px;
}

.cat,
.op-company{
  color:var(--cyan);
  font:500 16px "Space Grotesk";
  letter-spacing:.02em;
  text-transform:none
}

.card h3{
  margin:9px 0 10px;
  color:var(--ink);
  font:500 22px "Space Grotesk";
  letter-spacing:-.045em;
}

.card p{
  max-width:265px;
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.card-foot{
  padding-top:17px;
  border-top:1px solid rgba(255,255,255,.1);
  color:var(--muted);
  font-size:10px;
}

.card-foot span{
  display:flex;
  align-items:center;
  gap:8px;
}

.mini{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 10px var(--lime);
}

.arrow{
  display:grid;
  place-items:center;
  width:31px;
  height:31px;
  border-radius:50%;
  color:var(--ink);
  background:var(--lime);
}

.card-foot .arrow:hover{
  transform:translateY(-3px) rotate(45deg);
}

/* =========================
   OPPORTUNITIES
========================= */

.opps{
  padding:125px 0 132px;
  background:var(--paper);
  color:var(--ink);
}

.opps .eyebrow{
  color:var(--cyan);
}

.opps .eyebrow:before{
  background:var(--lime);
}

.opps .section-title em{
  color:var(--cyan);
}

.op-list{
  display:grid;
  gap:13px;
  margin-top:58px;
}

.op{
  display:grid;
  grid-template-columns:62px 1.45fr 1fr;
  gap:24px;
  align-items:center;
  padding:27px 30px;
  border:1px solid var(--border);
  background:rgba(21,35,63,.42);
  transition:.28s;
}

.op:hover{
  background:rgba(21,35,63,.56);
  border-color:rgba(77,179,255,.5);
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(37,136,255,.08);
}

.op-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  width:54px;
  height:64px;
  border-radius:5px;
  color:var(--ink);
  background:var(--lime);
  font:700 10px "Space Grotesk";
}

.op-main h3{
  margin:11px 0 8px;
  color:var(--ink);
  font:500 25px "Space Grotesk";
  letter-spacing:-.06em;
}

.op-main p{
  max-width:540px;
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.op-meta{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.open{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--cyan);
  font:8px "Space Grotesk";
  letter-spacing:.12em;
}

.op-tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:16px;
}

.op-tags span{
  padding:6px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  color:var(--muted);
  font-size:9px;
}

.op-side{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-self:stretch;
  gap:18px;
}

.facts{
  display:grid;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.facts span{
  display:flex;
  align-items:center;
  gap:7px;
}

.facts strong{
  color:var(--ink);
  font:600 14px "Space Grotesk";
}

.op-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.apply,
.whatsapp{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:34px;
  padding:0 11px;
  border:1px solid var(--lime);
  color:var(--ink);
  background:rgba(37,136,255,.12);
  font-size:10px;
  font-weight:700;
}

.apply:hover,
.whatsapp:hover{
  background:var(--lime);
}

.load-more{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-top:44px;
}

.load-more small{
  color:var(--muted);
  font:700 10px "Space Grotesk";
  letter-spacing:.14em;
}

/* =========================
   HOW IT WORKS
========================= */

.how{
  display:grid;
  grid-template-columns:.7fr 1.3fr;
  gap:75px;
  padding-top:135px;
  padding-bottom:135px;
}

.how p{
  max-width:240px;
  margin-top:30px;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.step{
  min-height:260px;
  padding:22px;
  border-top:1px solid var(--border);
  position:relative;
}

.step b{
  display:block;
  margin-top:48px;
  color:var(--cyan);
  font-size:22px;
}

.step h3{
  margin:18px 0 10px;
  color:var(--ink);
  font:500 20px "Space Grotesk";
}

.step p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.step i{
  position:absolute;
  top:21px;
  right:4px;
  color:var(--muted);
  font:10px "Space Grotesk";
}

.highlight{
  border-top-color:var(--lime);
  background:rgba(37,136,255,.07);
}

/* =========================
   RESUME
========================= */

.resume-intake{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:70px;
  padding-top:120px;
  padding-bottom:120px;
}

.resume-copy>p{
  max-width:430px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin:30px 0;
}

.resume-points{
  display:grid;
  gap:12px;
  color:var(--muted);
  font:11px "Space Grotesk";
  letter-spacing:.04em;
}

.resume-points span{
  display:flex;
  align-items:center;
  gap:12px;
}

.resume-points b{
  display:grid;
  place-items:center;
  width:26px;
  height:26px;
  border:1px solid var(--blue);
  border-radius:5px;
  color:var(--cyan);
  font-size:9px;
}

.resume-card{
  position:relative;
  overflow:hidden;
  padding:27px 30px 24px;
  border:1px solid var(--blue);
  border-radius:8px;
  background:linear-gradient(145deg,rgba(21,35,63,.94),rgba(15,25,48,.92));
  box-shadow:0 0 34px rgba(37,136,255,.12);
}
