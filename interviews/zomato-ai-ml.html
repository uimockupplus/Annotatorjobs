  <script>
    (() => {
      const dot = document.querySelector(".cursor-dot");
      const ring = document.querySelector(".cursor-ring");
      if (!dot || !ring) return;

      const pointerQuery = window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      );

      if (!pointerQuery.matches) return;

      const interactiveElements = [
        "a",
        "button",
        "input",
        "textarea",
        "select",
        "label",
        "[role='button']",
        "[tabindex]:not([tabindex='-1'])"
      ].join(",");

      let mouseX = -100;
      let mouseY = -100;
      let ringX = -100;
      let ringY = -100;
      let animationFrame = null;
      let pointerInside = false;

      function positionDot() {
        dot.style.transform =
          `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
      }

      function animateRing() {
        const ease = 0.18;

        ringX += (mouseX - ringX) * ease;
        ringY += (mouseY - ringY) * ease;

        ring.style.transform =
          `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;

        const distance = Math.hypot(mouseX - ringX, mouseY - ringY);

        if (distance > 0.15 && pointerInside) {
          animationFrame = requestAnimationFrame(animateRing);
        } else {
          ringX = mouseX;
          ringY = mouseY;

          ring.style.transform =
            `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;

          animationFrame = null;
        }
      }

      function startAnimation() {
        if (animationFrame === null) {
          animationFrame = requestAnimationFrame(animateRing);
        }
      }

      document.addEventListener("pointerenter", event => {
        if (event.pointerType !== "mouse") return;

        pointerInside = true;
        dot.classList.add("visible");
        ring.classList.add("visible");
      });

      document.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse") return;

        pointerInside = true;
        mouseX = event.clientX;
        mouseY = event.clientY;

        positionDot();
        dot.classList.add("visible");
        ring.classList.add("visible");

        startAnimation();
      }, { passive: true });

      document.addEventListener("pointerleave", event => {
        if (event.pointerType !== "mouse") return;

        pointerInside = false;

        dot.classList.remove("visible", "hot");
        ring.classList.remove("visible", "active");

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      });

      document.addEventListener("pointerover", event => {
        if (event.pointerType !== "mouse") return;

        const target = event.target instanceof Element
          ? event.target.closest(interactiveElements)
          : null;

        if (target) {
          ring.classList.add("active");
          dot.classList.add("hot");
        }
      });

      document.addEventListener("pointerout", event => {
        if (event.pointerType !== "mouse") return;

        const target = event.target instanceof Element
          ? event.target.closest(interactiveElements)
          : null;

        if (target && !target.contains(event.relatedTarget)) {
          ring.classList.remove("active");
          dot.classList.remove("hot");
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          dot.classList.remove("visible");
          ring.classList.remove("visible");
        }
      });
    })();
  </script>
